# eza theme rendered by noctalia (theming/terminal.nix). eza reads it on every run, so
# ls follows the wallpaper right away. Only directories change: they take the
# accent. Everything else keeps eza's defaults, which use the terminal's
# ANSI palette.
filekinds:
  directory: {foreground: "{{colors.primary.default.hex}}", is_bold: true}
