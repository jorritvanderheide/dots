[ColorScheme]
# qt5ct/qt6ct palette rendered by noctalia (theming.nix), replacing the
# built-in Qt template, which hard-codes the bevel shades (light, midlight,
# dark, mid) to white and greys in both modes and puts lists on the same tone
# as windows. Here:
# - base (lists, text fields) is the content tone shared with Zed's editor,
#   Ghostty and Obsidian's notes; window is the chrome tone.
# - Bevel shades come from the palette, ordered light > midlight > button >
#   mid > dark in both modes, as the Fusion style expects.
# - Links use the accent, darkened in light mode for contrast.
# - Disabled text is dimmed instead of identical to active text.
# Role order (https://doc.qt.io/qt-6/qpalette.html):
# windowText, button, light, midlight, dark, mid, text, brightText, buttonText,
# base, window, shadow, highlight, highlightedText, link, linkVisited,
# alternateBase, noRole, toolTipBase, toolTipText, placeholderText, accent
# The replace turns "light" into an empty, falsy string.
<* if {{ mode | replace: "light", "" }} *>
active_colors={{colors.on_surface.dark.hex}}, {{colors.surface_container.dark.hex}}, {{colors.surface_bright.dark.hex}}, {{colors.surface_container_highest.dark.hex}}, {{colors.surface_container_lowest.dark.hex}}, {{colors.surface.dark.hex}}, {{colors.on_surface.dark.hex}}, {{colors.on_surface.dark.hex}}, {{colors.on_surface.dark.hex}}, {{colors.surface_container_low.dark.hex}}, {{colors.surface.dark.hex}}, {{colors.shadow.dark.hex}}, {{colors.primary_container.dark.hex}}, {{colors.on_primary_container.dark.hex}}, {{colors.primary.dark.hex}}, {{colors.tertiary.dark.hex}}, {{colors.surface.dark.hex}}, {{colors.surface.dark.hex}}, {{colors.surface_container_high.dark.hex}}, {{colors.on_surface.dark.hex}}, {{colors.on_surface_variant.dark.hex}}, {{colors.primary.dark.hex}}
disabled_colors={{colors.outline.dark.hex}}, {{colors.surface_container.dark.hex}}, {{colors.surface_bright.dark.hex}}, {{colors.surface_container_highest.dark.hex}}, {{colors.surface_container_lowest.dark.hex}}, {{colors.surface.dark.hex}}, {{colors.outline.dark.hex}}, {{colors.on_surface.dark.hex}}, {{colors.outline.dark.hex}}, {{colors.surface_container_low.dark.hex}}, {{colors.surface.dark.hex}}, {{colors.shadow.dark.hex}}, {{colors.surface_container_highest.dark.hex}}, {{colors.outline.dark.hex}}, {{colors.outline.dark.hex}}, {{colors.outline.dark.hex}}, {{colors.surface.dark.hex}}, {{colors.surface.dark.hex}}, {{colors.surface_container_high.dark.hex}}, {{colors.on_surface.dark.hex}}, {{colors.outline.dark.hex}}, {{colors.outline.dark.hex}}
inactive_colors={{colors.on_surface.dark.hex}}, {{colors.surface_container.dark.hex}}, {{colors.surface_bright.dark.hex}}, {{colors.surface_container_highest.dark.hex}}, {{colors.surface_container_lowest.dark.hex}}, {{colors.surface.dark.hex}}, {{colors.on_surface.dark.hex}}, {{colors.on_surface.dark.hex}}, {{colors.on_surface.dark.hex}}, {{colors.surface_container_low.dark.hex}}, {{colors.surface.dark.hex}}, {{colors.shadow.dark.hex}}, {{colors.primary_container.dark.hex}}, {{colors.on_primary_container.dark.hex}}, {{colors.primary.dark.hex}}, {{colors.tertiary.dark.hex}}, {{colors.surface.dark.hex}}, {{colors.surface.dark.hex}}, {{colors.surface_container_high.dark.hex}}, {{colors.on_surface.dark.hex}}, {{colors.on_surface_variant.dark.hex}}, {{colors.primary.dark.hex}}
<* else *>
active_colors={{colors.on_surface.light.hex}}, {{colors.surface_container.light.hex}}, {{colors.surface_container_lowest.light.hex}}, {{colors.surface.light.hex}}, {{colors.outline_variant.light.hex}}, {{colors.surface_container_highest.light.hex}}, {{colors.on_surface.light.hex}}, {{colors.surface_container_lowest.light.hex}}, {{colors.on_surface.light.hex}}, {{colors.surface_container_lowest.light.hex}}, {{colors.surface.light.hex}}, {{colors.shadow.light.hex}}, {{colors.primary_container.light.hex}}, {{colors.on_primary_container.light.hex}}, {{colors.primary.light.hex | set_lightness: 22}}, {{colors.tertiary.light.hex | set_lightness: 22}}, {{colors.surface_container_low.light.hex}}, {{colors.surface.light.hex}}, {{colors.surface_container_high.light.hex}}, {{colors.on_surface.light.hex}}, {{colors.on_surface_variant.light.hex}}, {{colors.primary.light.hex}}
