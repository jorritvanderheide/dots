keys:
  # rocinante's own age key, /persist/system/var/lib/sops/age.key on its
  # encrypted disk -- how it decrypts at boot.
  - &rocinante_host age17999s298suylaqgmvh7ac0lwhzwjhft9jqztd0nlthc8ersd7awqtjeha7

  # Two YubiKeys that open the same: either one does everything, so losing
  # one loses nothing. Each holds two identities:
  #
  # - pin-policy=never, touch-policy=never -- how you edit rocinante's
  #   secrets; physical possession is the only gate.
  # - pin-policy=once, touch-policy=cached -- how you edit dapple's. The
  #   no-PIN identities can't, so a stolen laptop with a key still in
  #   doesn't open the server.
  #
  # The first YubiKey, serial 29635974: no PIN in slot 3, PIN in slot 1.
  - &yubikey1_nopin age1yubikey1qgejl25v5v97z9xl7y75qlagjenwk73awsc045skya7an5znsnp0z2pu7k7
  - &yubikey1_pin age1yubikey1qdzvztu74em2s9jmkr2jlgzuusx72mqjy30tyy49ra78y92n8vu56sx60qy

  # The second YubiKey, serial 38555351: no PIN in slot 1, PIN in slot 2.
  - &yubikey2_nopin age1yubikey1qwa2sy27xlnlfdxdnhksrvkup339vr6grzfhrsj86ynsxhspn4jd6v2p0ve
  - &yubikey2_pin age1yubikey1qd0msrl42056ezm4ensnfl5qx9vqtmvz6wvwqdgcfzrk5dk9a87yctxndhq

  # Passphrase identity -- fallback only, kept in the password manager.
  # See docs/secrets.md to regenerate.
  - &jorrit_passphrase age1j0qgknt0tlez0c3cvfuq30zv0vwp48c9q4q4wl4htgqngvcdkfdq6nr0v5

  # dapple's own age key, /persist/system/var/lib/sops/age.key on its
  # encrypted disk -- how it decrypts at boot.
  - &dapple_host age1tcp0k5tfcy3khr7zz5dal79hzfqtrp5fdvzrl5ds264fvmqp8cgq48pqrn

# One file per host, each for its own keys only: a host taken over doesn't
# give up the other's secrets.
creation_rules:
  - path_regex: secrets/rocinante\.yaml$
    key_groups:
      - age:
          - *rocinante_host
          - *yubikey1_nopin
          - *yubikey2_nopin
          - *jorrit_passphrase

  - path_regex: secrets/dapple\.yaml$
    key_groups:
      - age:
          - *dapple_host
          - *yubikey1_pin
          - *yubikey2_pin
          - *jorrit_passphrase
